[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
hashbrown = "0.15"
memmap2 = "0.9"
memchr = "2"
parquet = { version = "53", default-features = false }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"

